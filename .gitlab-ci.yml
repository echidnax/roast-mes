stages: [test, build]

backend-test:
  stage: test
  image: golang:1.27
  script:
    - cd backend
    - go vet ./...
    - go test ./...

frontend-build:
  stage: test
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build

docker-build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker compose build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH